services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nimoto
    ports:
      - '5432:5432'
    volumes:
      - nimoto-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/nimoto
      PORT: '8787'
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_WEB_URL: http://localhost:5173
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      NIMIQ_NETWORK: test-albatross
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8787:8787'

volumes:
  nimoto-pgdata:
