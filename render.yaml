# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Secrets are declared once, on nimoto-api, and the cron jobs read them back
# with `fromService`. (They can't live in an envVarGroup: Render forbids
# `sync: false` there, so a group would sync the keys with empty values.)
#
# The database is Neon, not a Render Postgres instance: set DATABASE_URL to the
# Neon *pooled* connection string, e.g.
#   postgresql://user:pass@ep-xxx-pooler.eu-central-1.aws.neon.tech/nimoto?sslmode=require
# Neon always requires TLS, hence DATABASE_SSL=true.

envVarGroups:
  # Non-secret settings shared by the API and both cron jobs.
  - name: nimoto-runtime
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_SSL
        value: "true"

services:
  - type: web
    name: nimoto-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    preDeployCommand: pnpm db:migrate && pnpm db:seed
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: nimoto-runtime
      - key: NODE_ENV
        value: production
      # The only secret you have to type: the Neon pooled connection string.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: nimoto-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_WEB_URL
        fromService:
          type: web
          name: nimoto-web
          envVarKey: RENDER_EXTERNAL_URL
      # Public address sponsors send NIM to, and the wallet you pay prizes from
      # by hand. The server never holds a key.
      - key: PRIZE_POOL_ADDRESS
        value: NQ63 6JD3 2CNK XJ8V 8RPS UXV1 CVG2 AXB9 491H

  - type: web
    name: nimoto-web
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist/web
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: nimoto-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

  # Keeps the next few UTC days pre-created so no player races the first write.
  - type: cron
    name: nimoto-daily-challenge
    runtime: node
    plan: starter
    region: oregon
    branch: main
    schedule: "50 23 * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm challenge:create -- --days 3
    envVars:
      - fromGroup: nimoto-runtime
      - key: DATABASE_URL
        fromService:
          type: web
          name: nimoto-api
          envVarKey: DATABASE_URL
      - key: ADMIN_API_TOKEN
        fromService:
          type: web
          name: nimoto-api
          envVarKey: ADMIN_API_TOKEN

  # Settles the day that just closed: ranks finishers and records who is owed
  # what. Prizes are transferred by hand — see `pnpm winners`.
  - type: cron
    name: nimoto-settlement
    runtime: node
    plan: starter
    region: oregon
    branch: main
    schedule: "10 0 * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm settle
    envVars:
      - fromGroup: nimoto-runtime
      - key: DATABASE_URL
        fromService:
          type: web
          name: nimoto-api
          envVarKey: DATABASE_URL
      - key: ADMIN_API_TOKEN
        fromService:
          type: web
          name: nimoto-api
          envVarKey: ADMIN_API_TOKEN
